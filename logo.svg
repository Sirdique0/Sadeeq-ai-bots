<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Sadeeq AI</title>
<desc id="desc">Neon blue and magenta Sadeeq AI star, letter A and orbital logo.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="48%" r="68%"><stop offset="0" stop-color="#111b4a"/><stop offset=".48" stop-color="#070b25"/><stop offset="1" stop-color="#010207"/></radialGradient>
  <linearGradient id="neon" x1="8%" y1="88%" x2="92%" y2="12%"><stop offset="0" stop-color="#08d9ff"/><stop offset=".45" stop-color="#3158ff"/><stop offset="1" stop-color="#ff18df"/></linearGradient>
  <linearGradient id="aFill" x1="18%" y1="90%" x2="82%" y2="8%"><stop offset="0" stop-color="#3158ff"/><stop offset=".42" stop-color="#9da8ff"/><stop offset=".68" stop-color="#f4e9ff"/><stop offset="1" stop-color="#f018ff"/></linearGradient>
  <radialGradient id="orb" cx="35%" cy="30%" r="72%"><stop offset="0" stop-color="#bdf8ff"/><stop offset=".2" stop-color="#198dff"/><stop offset=".62" stop-color="#3125c8"/><stop offset="1" stop-color="#13052f"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
