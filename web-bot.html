<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="origin"><meta name="theme-color" content="#05070d"><title>Sadeeq AI — Website Bot</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:transparent;color:#f7f8ff}body{overflow:hidden}.app{width:100%;height:100%;display:grid;place-items:center;background:#07101e}.box{width:min(430px,100%);height:min(700px,100%);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(7,11,21,.94);box-shadow:0 25px 80px rgba(0,0,0,.45)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.07)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:28px;height:28px}.brand strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;margin-top:3px;color:#758198;font-size:8px}.status{font-size:8px;font-weight:800;color:#ff9cad;white-space:nowrap}.status.ok{color:#68e9b0}.gate{margin:auto;width:min(370px,88%);text-align:center}.icon{margin:0 auto 12px;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:rgba(117,103,255,.1);border:1px solid rgba(117,103,255,.22);font-size:23px}.gate h1{margin:0 0 7px;font-size:18px}.gate p{margin:0 auto 18px;max-width:340px;color:#758198;font-size:10px;line-height:1.6}.form{display:grid;gap:8px}.form input{width:100%;border:1px solid rgba(255,255,255,.09);border-radius:11px;background:#0c1220;color:#fff;padding:13px;font:inherit;font-size:11px;outline:0}.form input:focus{border-color:#35cfff66;box-shadow:0 0 0 3px #35cfff12}.form button{height:42px;border:0;border-radius:11px;background:linear-gradient(100deg,#7567ff,#35cfff);color:#fff;font:800 10px inherit;cursor:pointer}.form button:disabled{opacity:.55;cursor:wait}.error{min-height:16px;color:#ff9cad;font-size:8px}.chat{display:flex;flex:1;min-height:0;flex-direction:column}.messages{flex:1;overflow:auto;padding:16px}.msg{max-width:84%;margin:0 0 9px;padding:10px 12px;border-radius:13px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.045);font-size:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{margin-left:auto;background:rgba(117,103,255,.12);border-color:rgba(117,103,255,.18)}.composer{padding:9px;border-top:1px solid rgba(255,255,255,.07)}form.send{display:flex;gap:7px;padding:6px 6px 6px 11px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#0c1220}.send textarea{flex:1;min-width:0;min-height:38px;max-height:110px;resize:none;border:0;outline:0;background:transparent;color:#fff;font:inherit;font-size:10px;padding:9px 2px}.send button{width:38px;height:38px;border:0;border-radius:11px;background:linear-gradient(135deg,#7567ff,#35cfff);color:#fff;font-size:17px;cursor:pointer}.foot{text-align:center;padding:5px;color:#566075;font-size:7px}.hidden{display:none!important}@media(max-width:450px){.box{border-radius:0;width:100%;height:100%}}</style></head><body><main class="app"><section class="box"><header class="head"><div class="brand"><img src="./logo.svg?v=3" alt=""><div><strong id="name">Sadeeq AI</strong><small id="sub">SECURE WEBSITE ACCESS</small></div></div><span id="status" class="status">LOCKED</span></header><section id="gate" class="gate"><div class="icon">⌁</div><h1>Secret ID required</h1><p id="gateText">Enter the Secret ID supplied by the bot owner. This website must be registered before chat can open.</p><form id="unlock" class="form"><input id="secret" type="password" maxlength="11" autocomplete="off" placeholder="Enter Secret ID" required><button id="unlockBtn" type="submit">Register &amp; Unlock</button><div id="error" class="error"></div></form></section><section id="chat" class="chat hidden"><div id="messages" class="messages"></div><div class="composer"><form id="send" class="send"><textarea id="input" rows="1" placeholder="Write a message…" autocomplete="off"></textarea><button id="sendBtn" type="submit" aria-label="Send">↑</button></form></div><div class="foot">Powered by Sadeeq AI</div></section></section></main><script src="./config.js?v=10"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cfg=window.SADEEQ_SUPABASE_URL&&window.SADEEQ_SUPABASE_KEY,client=cfg?window.supabase.createClient(window.SADEEQ_SUPABASE_URL,window.SADEEQ_SUPABASE_KEY,{auth:{persistSession:false}}):null,params=new URLSearchParams(location.search),botId=(params.get('bot')||'').trim(),storagePrefix='sadeeq:web:'+botId+':',maxOrigin=2048;let access=null,history=[],busy=false;function text(v){return String(v??'').trim()}function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function parentOrigin(){try{const a=location.ancestorOrigins;if(a&&a.length)return text(a[0]).slice(0,maxOrigin)}catch(_){}try{if(document.referrer){const u=new URL(document.referrer);return u.origin.slice(0,maxOrigin)}}catch(_){}return ''}const origin=parentOrigin();function validOrigin(o){return /^https?:\/\/[^/]+$/i.test(o)}function key(){return storagePrefix+encodeURIComponent(origin||'no-origin')}function save(){if(!access)return;try{localStorage.setItem(key(),JSON.stringify(access))}catch(_){}}function load(){try{const x=JSON.parse(localStorage.getItem(key())||'null');return x&&x.registration_id&&x.access_token?x:null}catch(_){return null}}function setStatus(ok,label){$('status').textContent=label;$('status').className='status'+(ok?' ok':'')}function message(role,content){const d=document.createElement('div');d.className='msg '+role;d.textContent=content;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function showChat(){ $('gate').classList.add('hidden');$('chat').classList.remove('hidden');setStatus(true,'CONNECTED');if(history.length===0)message('assistant','You are connected. How can I help you?')}function fail(msg){$('error').textContent=msg||'Unable to unlock this bot.'}async function register(secret){if(!client)throw Error('Sadeeq AI connection is unavailable.');if(!validOrigin(origin))throw Error('This bot must be opened inside a registered website iframe.');if(!/^sdq[a-z0-9]{6}$/.test(botId))throw Error('Invalid Bot ID.');const {data,error}=await client.rpc('sadeeq_web_register',{p_bot_id:botId,p_secret:secret,p_origin:origin,p_user_agent:navigator.userAgent.slice(0,1000)});if(error)throw error;if(!data?.registered||!data?.registration_id||!data?.access_token)throw Error('Website registration was not completed.');return {registration_id:String(data.registration_id),access_token:String(data.access_token),webs_id:String(data.webs_id||''),bot_name:String(data.bot_name||'Sadeeq AI'),bot_id:String(data.bot_id||botId)} }async function unlockExisting(x){if(!client||!validOrigin(origin))return false;const {data,error}=await client.rpc('sadeeq_web_validate_access',{p_bot_id:botId,p_registration_id:x.registration_id,p_access_token:x.access_token,p_origin:origin});if(error||!data?.allowed){try{localStorage.removeItem(key())}catch(_){}return false}access=x;$('name').textContent=x.bot_name||'Sadeeq AI';return true}async function sendChat(content){if(!access||busy)return;busy=true;$('sendBtn').disabled=true;history.push({role:'user',content});message('user',content);const out=message('assistant','');const url=`${window.SADEEQ_SUPABASE_URL}/functions/v1/sadeeq-bot-chat`;try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SADEEQ_SUPABASE_KEY},body:JSON.stringify({bot_id:botId,visitor_id:visitorId(),registration_id:access.registration_id,installation_token:access.access_token,origin,messages:history.slice(-20)})});if(!res.ok){let m='Chat access denied.';try{const j=await res.json();m=j.error||m}catch(_){}throw Error(m)}if(!res.body)throw Error('Chat stream unavailable.');const reader=res.body.getReader(),decoder=new TextDecoder();let buf='',answer='';for(;;){const {value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const lines=buf.split(/\r?\n/);buf=lines.pop()||'';for(const line of lines){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.delta){answer+=j.delta;out.textContent=answer;$('messages').scrollTop=$('messages').scrollHeight}}catch(_) {}}}if(!answer)out.textContent='No response received.';history.push({role:'assistant',content:answer||'No response received.'})}catch(e){out.remove();fail(e.message||'Chat request failed.');try{localStorage.removeItem(key())}catch(_){ }access=null;$('chat').classList.add('hidden');$('gate').classList.remove('hidden');setStatus(false,'LOCKED')}finally{busy=false;$('sendBtn').disabled=false}}function visitorId(){const k='sadeeq:visitor';try{let v=localStorage.getItem(k);if(!v){v=crypto.randomUUID?crypto.randomUUID():('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3)|8).toString(16)}));localStorage.setItem(k,v)}return v}catch(_){return '00000000-0000-4000-8000-000000000000'}}$('unlock').addEventListener('submit',async e=>{e.preventDefault();fail('');const secret=text($('secret').value);if(secret.length!==11)return fail('Enter a valid 11-character Secret ID.');$('unlockBtn').disabled=true;try{access=await register(secret);$('name').textContent=access.bot_name;save();showChat()}catch(e){fail(e.message||'Secret ID is invalid.');access=null}finally{$('unlockBtn').disabled=false}});$('send').addEventListener('submit',e=>{e.preventDefault();const v=text($('input').value);if(!v||busy)return;$('input').value='';sendChat(v)});$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').requestSubmit()}});(async()=>{if(!botId||!validOrigin(origin)){fail('Open this bot through its iframe on the registered website.');return}const saved=load();if(saved&&await unlockExisting(saved)){showChat();return}setStatus(false,'LOCKED')})()})();
</script></body></html>
