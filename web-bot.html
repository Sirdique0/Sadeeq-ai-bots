<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="origin"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Sadeeq AI — Website Bot</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;background:transparent;color:#f7f8ff}body{overflow:hidden}.app{width:100%;height:100%;display:grid;place-items:center;background:#07101e}.box{width:min(430px,100%);height:min(700px,100%);display:flex;flex-direction:column;overflow:hidden;border:1px solid #ffffff1c;border-radius:20px;background:#070b15f2;box-shadow:0 25px 80px #00000073}.head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:28px;height:28px}.brand strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;margin-top:3px;color:#758198;font-size:8px}.status{font-size:8px;font-weight:800;color:#ff9cad}.status.ok{color:#68e9b0}.gate{margin:auto;width:min(370px,88%);text-align:center}.icon{margin:0 auto 12px;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#7567ff1a;border:1px solid #7567ff38;font-size:23px}.gate h1{margin:0 0 7px;font-size:18px}.gate p{margin:0 auto 18px;max-width:340px;color:#758198;font-size:10px;line-height:1.6}.form{display:grid;gap:8px}.form input{width:100%;border:1px solid #ffffff17;border-radius:11px;background:#0c1220;color:#fff;padding:13px;font:inherit;font-size:11px;outline:0}.form button{height:42px;border:0;border-radius:11px;background:linear-gradient(100deg,#7567ff,#35cfff);color:#fff;font-weight:800;font-size:10px;cursor:pointer}.form button:disabled{opacity:.55;cursor:wait}.error{min-height:16px;color:#ff9cad;font-size:8px}.chat{display:flex;flex:1;min-height:0;flex-direction:column}.messages{flex:1;overflow:auto;padding:16px}.msg{max-width:84%;margin:0 0 9px;padding:10px 12px;border-radius:13px;border:1px solid #ffffff0f;background:#ffffff0b;font-size:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{margin-left:auto;background:#7567ff1f}.composer{padding:9px;border-top:1px solid #ffffff12}form.send{display:flex;gap:7px;padding:6px 6px 6px 11px;border:1px solid #ffffff1a;border-radius:14px;background:#0c1220}.send textarea{flex:1;min-width:0;min-height:38px;max-height:110px;resize:none;border:0;outline:0;background:transparent;color:#fff;font:inherit;font-size:10px;padding:9px 2px}.send button{width:38px;height:38px;border:0;border-radius:11px;background:linear-gradient(135deg,#7567ff,#35cfff);color:#fff;font-size:17px}.foot{text-align:center;padding:5px;color:#566075;font-size:7px}.hidden{display:none!important}@media(max-width:450px){.box{border-radius:0;width:100%;height:100%}}</style></head><body><main class="app"><section class="box"><header class="head"><div class="brand"><img src="./logo.svg?v=3" alt=""><div><strong id="name">Sadeeq AI</strong><small>SECURE WEBSITE ACCESS</small></div></div><span id="status" class="status">LOCKED</span></header><section id="gate" class="gate"><div class="icon">⌁</div><h1>Secret ID required</h1><p>Enter the Secret ID supplied by the bot owner. This website must be registered before chat can open.</p><form id="unlock" class="form"><input id="secret" type="password" maxlength="11" autocomplete="off" placeholder="Enter Secret ID" required><button id="unlockBtn" type="submit">Register &amp; Unlock</button><div id="error" class="error"></div></form></section><section id="chat" class="chat hidden"><div id="messages" class="messages"></div><div class="composer"><form id="send" class="send"><textarea id="input" rows="1" placeholder="Write a message…" autocomplete="off"></textarea><button id="sendBtn" type="submit">↑</button></form></div><div class="foot">Powered by Sadeeq AI</div></section></section></main><script src="./config.js?v=11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),url=window.SADEEQ_SUPABASE_URL,key=window.SADEEQ_SUPABASE_KEY,client=url&&key?window.supabase.createClient(url,key,{auth:{persistSession:false}}):null,p=new URLSearchParams(location.search),botId=(p.get('bot')||'').trim(),prefix='sadeeq:web:'+botId+':',origin=(()=>{try{const a=location.ancestorOrigins;if(a&&a.length)return String(a[0]).trim().replace(/\/$/,'').slice(0,2048)}catch(_){}try{return document.referrer?new URL(document.referrer).origin:''}catch(_){return''}})();let access=null,history=[],busy=false;const validOrigin=o=>/^https?:\/\/[^/?#]+$/i.test(o),canonicalOrigin=()=>String(origin||'').trim().replace(/\/$/,'').toLowerCase(),storeKey=()=>prefix+encodeURIComponent(canonicalOrigin()||'no-origin');function fail(x){$('error').textContent=x||''}function status(ok,t){$('status').textContent=t;$('status').className='status'+(ok?' ok':'')}function save(){try{if(access?.registration_id&&access?.access_token)localStorage.setItem(storeKey(),JSON.stringify({...access,saved_at:Date.now(),version:2}))}catch(_){}}function load(){try{const keys=[storeKey(),prefix+encodeURIComponent(origin||'no-origin')];for(const k of keys){const x=JSON.parse(localStorage.getItem(k)||'null');if(x&&x.registration_id&&x.access_token){if(k!==storeKey())try{localStorage.setItem(storeKey(),JSON.stringify(x))}catch(_){}return x}}return null}catch(_){return null}}function msg(r,c){const d=document.createElement('div');d.className='msg '+r;d.textContent=c;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function show(){ $('gate').classList.add('hidden');$('chat').classList.remove('hidden');status(true,'CONNECTED');if(!history.length)msg('assistant','You are connected. How can I help you?')}async function check(x){if(!client||!validOrigin(origin))return false;const q=await client.rpc('sadeeq_web_check_access',{p_bot_id:botId,p_registration_id:x.registration_id,p_access_token:x.access_token,p_origin:canonicalOrigin()});if(q.error)return false;if(!q.data?.allowed){try{localStorage.removeItem(storeKey())}catch(_){}return false}access=x;$('name').textContent=x.bot_name||'Sadeeq AI';save();return true}async function register(secret){if(!client)throw Error('Sadeeq AI connection is unavailable.');if(!validOrigin(origin))throw Error('This bot must be opened inside a website iframe.');if(!/^sdq[a-z0-9]{6}$/.test(botId))throw Error('Invalid Bot ID.');const q=await client.rpc('sadeeq_web_register',{p_bot_id:botId,p_secret:secret,p_origin:canonicalOrigin(),p_user_agent:navigator.userAgent.slice(0,1000)});if(q.error)throw q.error;const d=q.data;if(!d?.registered||!d.registration_id||!d.access_token)throw Error('Website registration was not completed.');const x={registration_id:String(d.registration_id),access_token:String(d.access_token),webs_id:String(d.webs_id||''),bot_name:String(d.bot_name||'Sadeeq AI'),bot_id:String(d.bot_id||botId)};if(!(await check(x)))throw Error('Registration was created but could not be verified. Chat was not opened.');return x}function visitorId(){const k='sadeeq:visitor';try{let v=localStorage.getItem(k);if(!v){v=crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3)|8).toString(16)});localStorage.setItem(k,v)}return v}catch(_){return'00000000-0000-4000-8000-000000000000'}}async function chat(c){if(!access||busy)return;busy=true;$('sendBtn').disabled=true;history.push({role:'user',content:c});msg('user',c);const out=msg('assistant','');try{const r=await fetch(url+'/functions/v1/sadeeq-bot-chat',{method:'POST',headers:{'Content-Type':'application/json',apikey:key},body:JSON.stringify({bot_id:botId,visitor_id:visitorId(),registration_id:access.registration_id,installation_token:access.access_token,origin:canonicalOrigin(),messages:history.slice(-20)})});if(!r.ok){let m='Chat access denied.';try{m=(await r.json()).error||m}catch(_){}throw Error(m)}if(!r.body)throw Error('Chat stream unavailable.');const rd=r.body.getReader(),de=new TextDecoder();let b='',a='';for(;;){const z=await rd.read();if(z.done)break;b+=de.decode(z.value,{stream:true});const ls=b.split(/\r?\n/);b=ls.pop()||'';for(const line of ls)if(line.startsWith('data:')){const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.delta){a+=j.delta;out.textContent=a}}catch(_) {}}}if(!a)out.textContent='No response received.';history.push({role:'assistant',content:a||'No response received.'});save()}catch(e){out.remove();fail(e.message||'Chat request failed.');if(/access denied|registration|token|suspended|invalid|not active/i.test(e.message||'')){try{localStorage.removeItem(storeKey())}catch(_){}access=null;$('chat').classList.add('hidden');$('gate').classList.remove('hidden');status(false,'LOCKED')}}finally{busy=false;$('sendBtn').disabled=false}}$('unlock').addEventListener('submit',async e=>{e.preventDefault();fail('');const s=$('secret').value.trim();if(s.length!==11)return fail('Enter a valid 11-character Secret ID.');$('unlockBtn').disabled=true;try{access=await register(s);save();show()}catch(e){access=null;fail(e.message||'Secret ID is invalid.')}finally{$('unlockBtn').disabled=false}});$('send').addEventListener('submit',e=>{e.preventDefault();const v=$('input').value.trim();if(v&&!busy){$('input').value='';chat(v)}});$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').requestSubmit()}});(async()=>{if(!botId||!validOrigin(origin)){fail('Open this bot through its iframe on the website.');return}const x=load();if(x&&await check(x)){show();return}status(false,'LOCKED')})()})();</script></body></html>
