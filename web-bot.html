<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070d">
<meta name="referrer" content="origin">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sadeeq AI Bot</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#05070d;color:#f7f8ff}.bot-app{position:relative;min-height:100vh;width:100%;display:grid;place-items:center;overflow:hidden;padding:18px;background:#07101e}.ambient{position:absolute;inset:-25%;background:radial-gradient(circle at 20% 25%,#7567ff45,transparent 28%),radial-gradient(circle at 80% 70%,#35cfff35,transparent 30%);filter:blur(30px);animation:float 10s ease-in-out infinite alternate}.bot-box{position:relative;z-index:2;width:min(720px,100%);min-height:520px;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.11);border-radius:24px;background:rgba(7,11,21,.78);backdrop-filter:blur(18px);box-shadow:0 30px 100px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.05);overflow:hidden;transition:background .35s ease,box-shadow .35s ease,border-color .35s ease}.bot-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.07);min-height:66px;background:rgba(4,7,15,.18)}.bot-identity{min-width:0;display:flex;align-items:center;gap:10px}.bot-logo{width:30px;height:30px;display:block;flex:0 0 30px;filter:drop-shadow(0 0 9px rgba(117,103,255,.35))}.bot-title-wrap{min-width:0}.bot-head h1{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;line-height:1.2;font-weight:800;letter-spacing:.01em}.bot-description{margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#758198;font-size:10px;line-height:1.3}.bot-status{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;font-size:9px;font-weight:800;white-space:nowrap}.bot-status i{width:7px;height:7px;border-radius:50%;display:block;background:#ff667f;box-shadow:0 0 10px rgba(255,102,127,.55)}.bot-status.online{color:#68e9b0}.bot-status.online i{background:#55e4a8;box-shadow:0 0 10px rgba(85,228,168,.65);animation:statusPulse 2s ease-in-out infinite}.bot-status.offline{color:#a7afbf}.locked{margin:auto;width:min(440px,90%);text-align:center;padding:30px 0}.lock-icon{margin:0 auto 12px;width:54px;height:54px;display:grid;place-items:center;border:1px solid rgba(117,103,255,.22);border-radius:17px;background:rgba(117,103,255,.1);font-size:24px;color:#a99fff}.locked h2{margin:0 0 7px;font-size:18px}.locked p{margin:0 auto 18px;max-width:380px;color:#758198;font-size:10px;line-height:1.55}.locked form{display:grid;grid-template-columns:1fr auto;gap:8px}.locked input{min-width:0;border:1px solid rgba(255,255,255,.09);border-radius:11px;background:#0c1220;color:#fff;padding:12px;font:inherit;font-size:11px;outline:0}.locked input:focus{border-color:#35cfff88;box-shadow:0 0 0 3px #35cfff12}.locked button{border:0;border-radius:11px;background:linear-gradient(100deg,#7567ff,#35cfff);color:#fff;padding:0 15px;font:800 10px inherit;cursor:pointer}.locked button:disabled{opacity:.55;cursor:wait}.locked small{grid-column:1/-1;min-height:14px;color:#ff9cad;font-size:8px}.chat{display:flex;flex:1;min-height:390px;flex-direction:column}.messages{flex:1;overflow:auto;padding:20px 20px 8px;scroll-behavior:smooth;background:rgba(2,6,14,.13);transition:background .35s ease}.message{max-width:82%;margin:0 0 10px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);font-size:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{margin-left:auto;background:rgba(117,103,255,.12);border-color:rgba(117,103,255,.18)}.message.assistant{margin-right:auto}.message.streaming{min-height:36px}.stream-content{display:inline-flex;align-items:center;gap:8px;min-height:20px}.stream-text{white-space:pre-wrap}.thinking-logo{width:18px;height:18px;display:block;flex:0 0 18px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(117,103,255,.6));animation:logoBreathe 1.55s ease-in-out infinite}.chat-form{padding:10px 12px 13px;border-top:1px solid rgba(255,255,255,.07);background:rgba(4,7,15,.2)}.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 12px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(12,18,32,.88);box-shadow:inset 0 1px rgba(255,255,255,.03),0 8px 28px rgba(0,0,0,.18)}.composer:focus-within{border-color:#35cfff55;box-shadow:0 0 0 3px #35cfff0c,inset 0 1px rgba(255,255,255,.03)}#input{flex:1;width:100%;min-width:0;min-height:38px;max-height:130px;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;color:#fff;padding:9px 2px;font:inherit;font-size:11px;line-height:1.45}#input::placeholder{color:#6f7788}.composer button{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#7567ff,#35cfff);color:#fff;cursor:pointer;box-shadow:0 7px 20px rgba(53,103,255,.2);transition:transform .18s ease,opacity .18s ease,filter .18s ease}.composer button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}.composer button:disabled{cursor:default;opacity:.48;transform:none}.send-arrow{font-size:22px;font-weight:500;line-height:1;transform:translateY(-1px)}.stop-icon{display:none;font-size:11px;line-height:1}.chat-form.is-generating .send-arrow{display:none}.chat-form.is-generating .stop-icon{display:block}.chat-form.is-generating .composer button{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);color:#fff}.float-button{display:none;position:relative;z-index:5;width:62px;height:62px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:linear-gradient(135deg,#7567ff,#35cfff);color:#fff;font-size:23px;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 30px rgba(53,103,255,.28);cursor:pointer;animation:pulse 2.8s ease-in-out infinite}.bot-app.embed{display:block;min-height:100vh;padding:0;background:transparent}.bot-app.embed .ambient{display:none}.bot-app.embed .float-button{display:grid;place-items:center;position:fixed;right:14px;bottom:14px}.bot-app.embed .bot-box{position:fixed;right:14px;bottom:14px;width:min(390px,calc(100vw - 28px));height:min(650px,calc(100vh - 28px));min-height:0}.bot-app.embed .bot-box.collapsed{display:none}.bot-app.embed footer{display:none}.bot-app:has(.bot-box.collapsed){place-items:end}.bot-box.collapsed{display:none}.bot-app:has(.bot-box.collapsed) .float-button{display:grid;place-items:center}footer{position:absolute;z-index:1;bottom:5px;left:0;right:0;text-align:center;color:#667086;font-size:9px}.hidden{display:none!important}@keyframes float{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.06)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes logoBreathe{0%,100%{transform:scale(.82);opacity:.62}50%{transform:scale(1.18);opacity:1}}@keyframes statusPulse{0%,100%{opacity:.7}50%{opacity:1}}@media(max-width:560px){.bot-app{padding:18px}.bot-box{min-height:calc(100vh - 36px);border-radius:19px}.bot-head{padding:16px}.bot-logo{width:28px;height:28px;flex-basis:28px}.bot-head h1{font-size:14px}.messages{padding:16px 14px 8px}.message{max-width:88%}.chat-form{padding:9px 9px 11px}.composer{border-radius:15px}.locked form{grid-template-columns:1fr}.locked button{height:40px}.bot-app.embed .bot-box{right:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100vh - 16px)}}@media(prefers-reduced-motion:reduce){.ambient,.float-button,.bot-status.online i,.thinking-logo{animation:none}}
</style>
</head>
<body>
<main id="botApp" class="bot-app embed bg-aurora">
<div class="ambient"></div>
<button id="floatButton" class="float-button" type="button" aria-label="Open chat">✦</button>
<section id="botBox" class="bot-box">
<header class="bot-head"><div class="bot-identity"><img class="bot-logo" src="./logo.svg?v=3" alt="Sadeeq AI"><div class="bot-title-wrap"><h1 id="botName">Loading bot…</h1><p id="botDescription" class="bot-description"></p></div></div><span id="status" class="bot-status offline" aria-live="polite"><i></i><span>Locked</span></span></header>
<div id="gate" class="locked"><div class="lock-icon">⌁</div><h2>Secret ID required</h2><p>Enter the Secret ID supplied by the bot owner. This website must be registered before chat can open.</p><form id="unlock"><input id="secret" type="password" maxlength="11" autocomplete="off" placeholder="Enter Secret ID" required><button id="unlockBtn" type="submit">Register &amp; Unlock</button><small id="error"></small></form></div>
<section id="chat" class="chat hidden"><div id="messages" class="messages" aria-live="polite"></div><form id="send" class="chat-form"><div class="composer"><textarea id="input" rows="1" placeholder="Write a message…" autocomplete="off" aria-label="Write a message"></textarea><button id="sendBtn" type="submit" aria-label="Send message" title="Send message"><span class="send-arrow" aria-hidden="true">↑</span><span class="stop-icon" aria-hidden="true">■</span></button></div></form></section>
</section><footer>Powered by Sadeeq AI</footer>
</main>
<script src="./config.js?v=12"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),url=window.SADEEQ_SUPABASE_URL,key=window.SADEEQ_SUPABASE_KEY,client=url&&key?window.supabase.createClient(url,key,{auth:{persistSession:false}}):null,p=new URLSearchParams(location.search),botId=(p.get('bot')||'').trim(),prefix='sadeeq:web:'+botId+':',origin=(()=>{try{const a=location.ancestorOrigins;if(a&&a.length)return String(a[0]).trim().replace(/\/$/,'').slice(0,2048)}catch(_){}try{return document.referrer?new URL(document.referrer).origin:''}catch(_){return''}})();
let access=null,history=[],busy=false,controller=null,streamNode=null;
const validOrigin=o=>/^https?:\/\/[^/?#]+$/i.test(o),canonicalOrigin=()=>String(origin||'').trim().replace(/\/$/,'').toLowerCase(),storeKey=()=>prefix+encodeURIComponent(canonicalOrigin()||'no-origin');
function fail(x){$('error').textContent=x||''}
function status(ok,t){$('status').innerHTML='<i></i><span></span>';$('status').querySelector('span').textContent=t;$('status').className='bot-status'+(ok?' online':' offline')}
function save(){try{if(access?.registration_id&&access?.access_token)localStorage.setItem(storeKey(),JSON.stringify({...access,saved_at:Date.now(),version:4}))}catch(_){} }
function load(){try{const keys=[storeKey(),prefix+encodeURIComponent(origin||'no-origin')];for(const k of keys){const x=JSON.parse(localStorage.getItem(k)||'null');if(x&&x.registration_id&&x.access_token){if(k!==storeKey())try{localStorage.setItem(storeKey(),JSON.stringify(x))}catch(_){}return x}}return null}catch(_){return null}}
function msg(r,c){const d=document.createElement('div');d.className='message '+r;d.textContent=c;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}
function thinking(){const d=document.createElement('div');d.className='message assistant streaming';const wrap=document.createElement('span');wrap.className='stream-content';const img=document.createElement('img');img.className='thinking-logo';img.src='./logo.svg?v=3';img.alt='Sadeeq AI';const text=document.createElement('span');text.className='stream-text';wrap.append(img,text);d.appendChild(wrap);$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}
function setGenerating(v){$('send').classList.toggle('is-generating',v);$('input').disabled=v;$('sendBtn').disabled=false;$('sendBtn').setAttribute('aria-label',v?'Stop response':'Send message');$('sendBtn').setAttribute('title',v?'Stop response':'Send message')}
function finishStream(answer,keepPartial){if(streamNode?.isConnected){streamNode.classList.remove('streaming');streamNode.querySelector('.thinking-logo')?.remove();const b=streamNode.querySelector('.stream-text');if(b)b.textContent=answer||'';if(answer||keepPartial)history.push({role:'assistant',content:answer||''});else streamNode.remove()}streamNode=null;setGenerating(false);$('input').style.height='auto';focusInput()}
function stopGeneration(){if(!busy)return;const partial=streamNode?.querySelector('.stream-text')?.textContent||'';if(controller){try{controller.abort()}catch(_){}controller=null}finishStream(partial,true)}
function focusInput(){requestAnimationFrame(()=>$('input')?.focus())}
function resizeInput(){const e=$('input');if(!e)return;e.style.height='auto';e.style.height=Math.min(e.scrollHeight,130)+'px'}
async function check(x){if(!client||!validOrigin(origin))return false;const q=await client.rpc('sadeeq_web_check_access',{p_bot_id:botId,p_registration_id:x.registration_id,p_access_token:x.access_token,p_origin:canonicalOrigin()});if(q.error)return false;if(!q.data?.allowed){try{localStorage.removeItem(storeKey())}catch(_){}return false}access=x;$('botName').textContent=x.bot_name||'Sadeeq AI';return true}
async function register(secret){if(!client)throw Error('Sadeeq AI connection is unavailable.');if(!validOrigin(origin))throw Error('This bot must be opened inside a website iframe.');if(!/^sdq[a-z0-9]{6}$/.test(botId))throw Error('Invalid Bot ID.');const q=await client.rpc('sadeeq_web_register',{p_bot_id:botId,p_secret:secret,p_origin:canonicalOrigin(),p_user_agent:navigator.userAgent.slice(0,1000)});if(q.error)throw q.error;const d=q.data;if(!d?.registered||!d.registration_id||!d.access_token)throw Error('Website registration was not completed.');const x={registration_id:String(d.registration_id),access_token:String(d.access_token),webs_id:String(d.webs_id||''),bot_name:String(d.bot_name||'Sadeeq AI'),bot_id:String(d.bot_id||botId)};if(!(await check(x)))throw Error('Registration was created but could not be verified. Chat was not opened.');return x}
function visitorId(){const k='sadeeq:visitor';try{let v=localStorage.getItem(k);if(!v){v=crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3)|8).toString(16)});localStorage.setItem(k,v)}return v}catch(_){return'00000000-0000-4000-8000-000000000000'}}
async function chat(c){if(!access||busy)return;busy=true;history.push({role:'user',content:c});msg('user',c);streamNode=thinking();setGenerating(true);controller=new AbortController();const activeController=controller;try{const r=await fetch(url+'/functions/v1/sadeeq-bot-chat',{method:'POST',headers:{'Content-Type':'application/json',apikey:key},body:JSON.stringify({bot_id:botId,visitor_id:visitorId(),registration_id:access.registration_id,installation_token:access.access_token,origin:canonicalOrigin(),messages:history.slice(-20)}),signal:activeController.signal});if(!r.ok){let m='Chat access denied.';try{m=(await r.json()).error||m}catch(_){}throw Error(m)}if(!r.body)throw Error('Chat stream unavailable.');const rd=r.body.getReader(),de=new TextDecoder();let b='',a='';for(;;){const z=await rd.read();if(z.done)break;b+=de.decode(z.value,{stream:true});const ls=b.split(/\r?\n/);b=ls.pop()||'';for(const line of ls)if(line.startsWith('data:')){const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.delta){a+=j.delta;const out=streamNode?.querySelector('.stream-text');if(out)out.textContent=a;$('messages').scrollTop=$('messages').scrollHeight}}catch(_) {}}}if(b){for(const line of b.split(/\r?\n/)){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.delta){a+=j.delta;const out=streamNode?.querySelector('.stream-text');if(out)out.textContent=a}}catch(_) {}}}if(streamNode)finishStream(a,false)}catch(e){if(e?.name==='AbortError'){return}if(streamNode?.isConnected){streamNode.classList.remove('streaming');streamNode.querySelector('.thinking-logo')?.remove();const out=streamNode.querySelector('.stream-text');if(out)out.textContent=e.message||'Chat request failed.'}else msg('assistant',e.message||'Chat request failed.');streamNode=null;fail(e.message||'Chat request failed.');if(/access denied|registration|token|suspended|invalid|not active/i.test(e.message||'')){try{localStorage.removeItem(storeKey())}catch(_){}access=null;$('chat').classList.add('hidden');$('gate').classList.remove('hidden');status(false,'Locked')}}finally{if(controller===activeController)controller=null;busy=false;setGenerating(false);focusInput()}}
function show(){$('gate').classList.add('hidden');$('chat').classList.remove('hidden');status(true,'Online');if(!history.length)msg('assistant','You are connected. How can I help you?');focusInput()}
$('unlock').addEventListener('submit',async e=>{e.preventDefault();fail('');const s=$('secret').value.trim();if(s.length!==11)return fail('Enter a valid 11-character Secret ID.');$('unlockBtn').disabled=true;try{access=await register(s);save();show()}catch(e){access=null;fail(e.message||'Secret ID is invalid.')}finally{$('unlockBtn').disabled=false}});
$('send').addEventListener('submit',e=>{e.preventDefault();if(busy){stopGeneration();return}const v=$('input').value.trim();if(v){$('input').value='';$('input').style.height='auto';chat(v)}});
$('input').addEventListener('input',resizeInput);
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').requestSubmit()}});
$('floatButton').addEventListener('click',()=>{$('botBox').classList.remove('collapsed');$('floatButton').style.display='none';focusInput()});
(async()=>{if(!botId||!validOrigin(origin)){fail('Open this bot through its iframe on the website.');return}const x=load();if(x&&await check(x)){show();return}status(false,'Locked')})();
window.addEventListener('beforeunload',()=>{if(controller)controller.abort()});
})();
</script>
</body>
</html>
