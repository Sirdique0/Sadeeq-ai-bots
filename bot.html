<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070d"><meta name="description" content="Sadeeq AI bot"><title>Sadeeq AI Bot</title><link rel="stylesheet" href="./bot.css?v=4"></head><body><main id="botApp" class="bot-app bg-aurora"><div class="ambient"></div><button id="floatButton" class="float-button" type="button" aria-label="Open chat">✦</button><section id="botBox" class="bot-box"><header class="bot-head"><div class="bot-identity"><img class="bot-logo" src="./logo.svg?v=3" alt="Sadeeq AI"><h1 id="botName">Loading bot…</h1></div><span id="botStatus" class="bot-status offline" aria-live="polite"><i></i><span>Offline</span></span></header><div id="locked" class="locked"><div class="lock-icon">⌁</div><h2>Secret ID required</h2><p>This bot is protected. Enter the Secret ID supplied by the bot owner to continue.</p><form id="secretForm"><input id="secretInput" type="password" autocomplete="off" placeholder="Enter Secret ID" maxlength="11" required><button type="submit">Unlock Bot</button><small id="secretError"></small></form></div><div id="chat" class="chat hidden"><div id="messages" class="messages" aria-live="polite"></div><form id="chatForm" class="chat-form"><div class="composer"><textarea id="messageInput" rows="1" autocomplete="off" placeholder="Write a message…" aria-label="Write a message"></textarea><button id="sendButton" class="send-button" type="submit" aria-label="Send message" title="Send message"><span class="send-arrow" aria-hidden="true">↑</span><span class="stop-icon" aria-hidden="true">■</span></button></div></form></div></section><footer id="footerName"></footer></main><script src="./config.js?v=10"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="./bot.js?v=6"></script></body></html>
