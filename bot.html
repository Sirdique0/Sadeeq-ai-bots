<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070d"><meta name="description" content="Sadeeq AI bot"><meta http-equiv="Cache-Control" content="no-store"><link rel="icon" href="./logo.svg?v=3" type="image/svg+xml"><title>Sadeeq AI Bot</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#05070d;color:#f7f8ff}.bot-app{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:18px;background:#07101e}.ambient{position:absolute;inset:-25%;background:radial-gradient(circle at 20% 25%,#7567ff45,transparent 28%),radial-gradient(circle at 80% 70%,#35cfff35,transparent 30%);filter:blur(30px);animation:float 10s ease-in-out infinite alternate}.bot-box{position:relative;z-index:2;width:min(720px,100%);min-height:520px;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.11);border-radius:24px;background:rgba(7,11,21,.78);backdrop-filter:blur(18px);box-shadow:0 30px 100px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.05);overflow:hidden}.bot-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.07);min-height:66px}.bot-identity{min-width:0;display:flex;align-items:center;gap:10px}.bot-logo{width:30px;height:30px;display:block;flex:0 0 30px;filter:drop-shadow(0 0 9px rgba(117,103,255,.35))}.bot-title-wrap{min-width:0}.bot-head h1{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;line-height:1.2;font-weight:800;letter-spacing:.01em}.bot-description{margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#758198;font-size:10px;line-height:1.3}.bot-status{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;font-size:9px;font-weight:800;white-space:nowrap}.bot-status i{width:7px;height:7px;border-radius:50%;display:block;background:#ff667f;box-shadow:0 0 10px rgba(255,102,127,.55)}.bot-status.online{color:#68e9b0}.bot-status.online i{background:#55e4a8;box-shadow:0 0 10px rgba(85,228,168,.65);animation:statusPulse 2s ease-in-out infinite}.bot-status.offline{color:#a7afbf}.locked{margin:auto;width:min(440px,90%);text-align:center;padding:30px 0}.lock-icon{margin:0 auto 12px;width:54px;height:54px;display:grid;place-items:center;border:1px solid rgba(117,103,255,.22);border-radius:17px;background:rgba(117,103,255,.1);font-size:24px;color:#a99fff}.locked h2{margin:0 0 7px;font-size:18px}.locked p{margin:0 auto 18px;max-width:380px;color:#758198;font-size:10px;line-height:1.55}.locked form{display:grid;grid-template-columns:1fr auto;gap:8px}.locked input{min-width:0;border:1px solid rgba(255,255,255,.09);border-radius:11px;background:#0c1220;color:#fff;padding:12px;font:inherit;font-size:11px;outline:0}.locked input:focus{border-color:#35cfff88;box-shadow:0 0 0 3px #35cfff12}.locked button{border:0;border-radius:11px;background:linear-gradient(100deg,#7567ff,#35cfff);color:#fff;padding:0 15px;font:800 10px inherit;cursor:pointer}.locked small{grid-column:1/-1;min-height:14px;color:#ff9cad;font-size:8px}.chat{display:flex;flex:1;min-height:390px;flex-direction:column}.messages{flex:1;overflow:auto;padding:20px 20px 8px;scroll-behavior:smooth}.message{max-width:82%;margin:0 0 10px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);font-size:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{margin-left:auto;background:rgba(117,103,255,.12);border-color:rgba(117,103,255,.18)}.message.assistant{margin-right:auto}.message.streaming{min-height:36px}.stream-content{display:inline-flex;align-items:center;gap:8px;min-height:20px}.stream-text{white-space:pre-wrap}.thinking-logo{width:18px;height:18px;display:block;flex:0 0 18px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(117,103,255,.6));animation:logoBreathe 1.55s ease-in-out infinite}.chat-form{padding:10px 12px 13px;border-top:1px solid rgba(255,255,255,.07)}.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 12px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(12,18,32,.9);box-shadow:inset 0 1px rgba(255,255,255,.03),0 8px 28px rgba(0,0,0,.18)}.composer:focus-within{border-color:#35cfff55;box-shadow:0 0 0 3px #35cfff0c,inset 0 1px rgba(255,255,255,.03)}#messageInput{flex:1;width:100%;min-width:0;min-height:38px;max-height:130px;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;color:#fff;padding:9px 2px;font:inherit;font-size:11px;line-height:1.45}#messageInput::placeholder{color:#6f7788}.composer button{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#7567ff,#35cfff);color:#fff;cursor:pointer;box-shadow:0 7px 20px rgba(53,103,255,.2);transition:transform .18s ease,opacity .18s ease,filter .18s ease}.composer button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}.composer button:disabled{cursor:default;opacity:.48;transform:none}.send-arrow{font-size:22px;font-weight:500;line-height:1;transform:translateY(-1px)}.stop-icon{display:none;font-size:11px;line-height:1}.chat-form.is-generating .send-arrow{display:none}.chat-form.is-generating .stop-icon{display:block}.chat-form.is-generating .composer button{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);color:#fff}.float-button{display:none;position:relative;z-index:5;width:62px;height:62px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:linear-gradient(135deg,#7567ff,#35cfff);color:#fff;font-size:23px;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 30px rgba(53,103,255,.28);cursor:pointer;animation:pulse 2.8s ease-in-out infinite}.bot-app.embed{display:block;min-height:100vh;padding:0;background:transparent}.bot-app.embed .ambient{display:none}.bot-app.embed .float-button{display:grid;place-items:center;position:fixed;right:14px;bottom:14px}.bot-app.embed .bot-box{position:fixed;right:14px;bottom:14px;width:min(390px,calc(100vw - 28px));height:min(650px,calc(100vh - 28px));min-height:0}.bot-app.embed .bot-box.collapsed{display:none}.bot-app.embed footer{display:none}.bot-app:has(.bot-box.collapsed){place-items:end}.bot-box.collapsed{display:none}.bot-app:has(.bot-box.collapsed) .float-button{display:grid;place-items:center}footer{position:absolute;z-index:1;bottom:5px;left:0;right:0;text-align:center;color:#667086;font-size:9px}.hidden{display:none!important}.bg-aurora .ambient{background:radial-gradient(circle at 20% 25%,#7567ff55,transparent 28%),radial-gradient(circle at 80% 70%,#35cfff45,transparent 30%)}.bg-neon-grid{background-image:linear-gradient(#35cfff12 1px,transparent 1px),linear-gradient(90deg,#7567ff12 1px,transparent 1px);background-size:24px 24px}.bg-neon-grid .ambient{background:radial-gradient(circle at 50% 40%,#35cfff22,transparent 35%)}.bg-cosmic .ambient{background:radial-gradient(circle at 75% 25%,#b149ff66,transparent 22%),radial-gradient(circle at 20% 75%,#35cfff55,transparent 28%)}.bg-ocean .ambient{background:radial-gradient(circle at 25% 25%,#1b8dff44,transparent 28%),radial-gradient(circle at 80% 80%,#00e1c744,transparent 28%)}.bg-sunset .ambient{background:radial-gradient(circle at 75% 25%,#ff4e9c55,transparent 25%),radial-gradient(circle at 20% 80%,#ff9b4a44,transparent 25%)}.bg-matrix .ambient{background:repeating-linear-gradient(90deg,transparent 0 24px,#2cff9b10 25px),linear-gradient(#03160f,#020907)}.bg-glass .ambient{background:linear-gradient(130deg,#ffffff14,#35cfff18,#7567ff18);filter:blur(45px)}@keyframes float{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.06)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes logoBreathe{0%,100%{transform:scale(.82);opacity:.62}50%{transform:scale(1.18);opacity:1}}@keyframes statusPulse{0%,100%{opacity:.7}50%{opacity:1}}@media(max-width:560px){.bot-app{padding:18px}.bot-box{min-height:calc(100vh - 36px);border-radius:19px}.bot-head{padding:16px}.bot-logo{width:28px;height:28px;flex-basis:28px}.bot-head h1{font-size:14px}.messages{padding:16px 14px 8px}.message{max-width:88%}.chat-form{padding:9px 9px 11px}.composer{border-radius:15px}.locked form{grid-template-columns:1fr}.locked button{height:40px}.bot-app.embed .bot-box{right:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100vh - 16px)}}@media(prefers-reduced-motion:reduce){.ambient,.float-button,.bot-status.online i,.thinking-logo{animation:none}}
</style>
</head>
<body>
<main id="botApp" class="bot-app bg-aurora"><div class="ambient"></div><button id="floatButton" class="float-button" type="button" aria-label="Open chat">✦</button><section id="botBox" class="bot-box"><header class="bot-head"><div class="bot-identity"><img class="bot-logo" src="./logo.svg?v=3" alt="Sadeeq AI"><div class="bot-title-wrap"><h1 id="botName">Loading bot…</h1><p id="botDescription" class="bot-description"></p></div></div><span id="botStatus" class="bot-status offline" aria-live="polite"><i></i><span>Offline</span></span></header><div id="locked" class="locked"><div class="lock-icon">⌁</div><h2>Secret ID required</h2><p>This bot is protected. Enter the Secret ID supplied by the bot owner to continue.</p><form id="secretForm"><input id="secretInput" type="password" autocomplete="off" placeholder="Enter Secret ID" maxlength="11" required><button type="submit">Unlock Bot</button><small id="secretError"></small></form></div><div id="chat" class="chat hidden"><div id="messages" class="messages" aria-live="polite"></div><form id="chatForm" class="chat-form"><div class="composer"><textarea id="messageInput" rows="1" autocomplete="off" placeholder="Write a message…" aria-label="Write a message"></textarea><button id="sendButton" class="send-button" type="submit" aria-label="Send message" title="Send message"><span class="send-arrow" aria-hidden="true">↑</span><span class="stop-icon" aria-hidden="true">■</span></button></div></form></div></section><footer id="footerName">Powered by Sadeeq AI</footer></main>
<script src="./config.js?v=10"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';const params=new URLSearchParams(location.search),botId=params.get('bot')||'',playground=params.get('playground')==='1',embed=params.get('embed')==='1',SUPABASE_URL=window.SADEEQ_SUPABASE_URL||'',client=window.supabase?.createClient(SUPABASE_URL,window.SADEEQ_SUPABASE_KEY||'',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);let bot=null,liveChannel=null,runtimeChannel=null,unlocked=false,generating=false,streamNode=null,requestController=null,secretForRuntime='',history=[],runtimeAvailable=true;const visitorKey='sadeeq_ai_visitor_id_v1';function visitorId(){let id=localStorage.getItem(visitorKey);if(!id){id=crypto?.randomUUID?.()||(''+Date.now()+Math.random()).replace(/\D/g,'').slice(0,32);localStorage.setItem(visitorKey,id)}return id}function text(id,v){const e=$(id);if(e)e.textContent=v??''}function applyBackground(k){$('botApp').className=`bot-app${embed?' embed':''} bg-${k||'aurora'}`}function msg(v,k='assistant',role=''){const d=document.createElement('div');d.className=`message ${k}`;if(role)d.dataset.role=role;d.textContent=v;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function setStatus(online){const e=$('botStatus');if(!e)return;e.classList.toggle('online',online);e.classList.toggle('offline',!online);e.querySelector('span').textContent=online?'Online':'Offline'}function showUnavailable(message){stopGeneration();unlocked=false;setStatus(false);$('chat').classList.add('hidden');$('locked').classList.add('hidden');text('botName','Bot unavailable');text('botDescription',message||'This bot is currently unavailable.')}function applyLiveConfig(next){if(!next)return;const oldWelcome=bot?.welcome_message;bot={...(bot||{}),...next};text('botName',bot.name);text('botDescription',bot.description);applyBackground(bot.background_key);setStatus(!!bot.enabled&&!bot.suspended&&bot.status==='active'&&runtimeAvailable);document.title=`${bot.name} — Sadeeq AI`;if(!bot.enabled||bot.suspended||bot.status!=='active'){showUnavailable('This bot is disabled, suspended, or no longer available.');return}if(!runtimeAvailable){showUnavailable('Sadeeq AI runtime is currently unavailable.');return}if(!unlocked){$('locked').classList.remove('hidden');$('chat').classList.add('hidden')}else if(bot.welcome_message!==undefined&&bot.welcome_message!==oldWelcome){const w=$('messages')?.querySelector('[data-role="welcome"]');if(w)w.textContent=bot.welcome_message||'Hello! How can I help you today?';if(history[0]?.role==='assistant')history[0].content=bot.welcome_message||'Hello! How can I help you today?'}}async function checkRuntime(){if(!client||!botId)return true;const{data,error}=await client.rpc('sadeeq_get_public_runtime',{p_bot_id:botId});if(error||!data)return true;runtimeAvailable=!!data.system_enabled&&!!data.model_ready;if(bot)applyLiveConfig(bot);return runtimeAvailable}function subscribeLive(){if(!client||!botId)return;liveChannel=client.channel(`bot:${botId}`).on('broadcast',{event:'bot_changed'},payload=>{const p=payload?.payload||payload;if(p?.operation==='DELETE'){showUnavailable('This bot has been deleted.');return}if(p?.bot)applyLiveConfig(p.bot)}).subscribe((status,error)=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Bot live sync unavailable',error)});runtimeChannel=client.channel('sadeeq:runtime').on('broadcast',{event:'runtime_changed'},async()=>{await checkRuntime()}).subscribe((status,error)=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Runtime live sync unavailable',error)})}async function load(){if(!botId){text('botName','Bot not specified');return}subscribeLive();const{data,error}=await client.rpc('sadeeq_get_public_bot',{p_bot_id:botId});if(error)throw error;if(!data){showUnavailable('This bot is disabled, suspended, or no longer available.');return}bot=data;text('botName',bot.name);text('botDescription',bot.description);applyBackground(bot.background_key);runtimeAvailable=await checkRuntime();setStatus(!!bot.enabled&&!bot.suspended&&bot.status==='active'&&runtimeAvailable);document.title=`${bot.name} — Sadeeq AI`;if(!bot.enabled||bot.suspended||bot.status!=='active'){showUnavailable('This bot is disabled, suspended, or no longer available.');return}if(!runtimeAvailable){showUnavailable('Sadeeq AI runtime is currently unavailable.');return}if(playground){const{data:{session}}=await client.auth.getSession();if(session){const{data:ok}=await client.rpc('sadeeq_is_owner');if(ok===true){const r=await client.from('sadeeq_bots').select('id').eq('bot_id',botId).single();if(!r.error&&r.data){const s=await client.rpc('sadeeq_get_bot_secret',{p_bot_id:r.data.id});if(!s.error&&s.data)secretForRuntime=s.data}unlock();return}}}$('locked').classList.remove('hidden')}function unlock(){if(!bot||!bot.enabled||bot.suspended||bot.status!=='active'||!runtimeAvailable)return;unlocked=true;setStatus(true);$('locked').classList.add('hidden');$('chat').classList.remove('hidden');$('messages').innerHTML='';history=[];const welcome=bot.welcome_message||'Hello! How can I help you today?';msg(welcome,'assistant','welcome');history.push({role:'assistant',content:welcome});focusInput()}$('secretForm').addEventListener('submit',async e=>{e.preventDefault();const secret=$('secretInput').value.trim();$('secretError').textContent='Checking…';const{data,error}=await client.rpc('sadeeq_verify_bot_secret',{p_bot_id:botId,p_secret:secret});if(error||data!==true){$('secretError').textContent=error?.message||'Invalid Secret ID.';return}secretForRuntime=secret;if(!(await checkRuntime())){$('secretError').textContent='Sadeeq AI runtime is currently unavailable.';return}unlock()});function resizeInput(){const e=$('messageInput');if(!e)return;e.style.height='auto';e.style.height=Math.min(e.scrollHeight,130)+'px'}function focusInput(){requestAnimationFrame(()=>$('messageInput')?.focus())}function setGenerating(v){generating=v;$('chatForm').classList.toggle('is-generating',v);$('messageInput').disabled=v;$('sendButton').setAttribute('aria-label',v?'Stop response':'Send message');$('sendButton').setAttribute('title',v?'Stop response':'Send message')}function thinking(){const d=document.createElement('div');d.className='message assistant streaming';const w=document.createElement('span');w.className='stream-content';const img=document.createElement('img');img.className='thinking-logo';img.src='./logo.svg?v=3';img.alt='Sadeeq AI';const body=document.createElement('span');body.className='stream-text';w.append(img,body);d.append(w);$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function finishStream(answer){if(streamNode?.isConnected){streamNode.classList.remove('streaming');streamNode.querySelector('.thinking-logo')?.remove();if(answer)history.push({role:'assistant',content:answer});else streamNode.remove()}streamNode=null;setGenerating(false);focusInput()}function stopGeneration(){if(!generating)return;if(requestController){requestController.abort();requestController=null}const body=streamNode?.querySelector('.stream-text');const partial=body?.textContent||'';finishStream(partial)}async function startGeneration(){const input=$('messageInput'),v=input.value.trim();if(!v||generating||!unlocked||!secretForRuntime)return;msg(v,'user');history.push({role:'user',content:v});input.value='';resizeInput();streamNode=thinking();setGenerating(true);requestController=new AbortController();try{const response=await fetch(`${SUPABASE_URL}/functions/v1/sadeeq-bot-chat`,{method:'POST',headers:{'Content-Type':'application/json'},signal:requestController.signal,body:JSON.stringify({bot_id:botId,secret:secretForRuntime,visitor_id:visitorId(),messages:history.slice(-20)})});if(!response.ok){let detail='Unable to generate a response.';try{const j=await response.json();detail=j.error||detail}catch{}throw new Error(detail)}if(!response.body)throw new Error('Streaming is not available.');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',answer='';while(true){const{value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const chunks=buffer.split(/\r?\n\r?\n/);buffer=chunks.pop()||'';for(const chunk of chunks){for(const line of chunk.split(/\r?\n/)){if(!line.startsWith('data:'))continue;const data=line.slice(5).trim();if(!data||data==='[DONE]')continue;try{const p=JSON.parse(data);if(p.delta){answer+=p.delta;const b=streamNode?.querySelector('.stream-text');if(b)b.textContent=answer;$('messages').scrollTop=$('messages').scrollHeight}}catch{}}}}if(buffer){for(const line of buffer.split(/\r?\n/)){if(!line.startsWith('data:'))continue;const data=line.slice(5).trim();if(data&&data!=='[DONE]'){try{const p=JSON.parse(data);if(p.delta){answer+=p.delta;const b=streamNode?.querySelector('.stream-text');if(b)b.textContent=answer}}catch{}}}}finishStream(answer)}catch(e){if(e?.name==='AbortError')return;renderError(e?.message||'Unable to generate a response.')}finally{requestController=null}}function renderError(message){if(streamNode?.isConnected){streamNode.classList.remove('streaming');streamNode.querySelector('.thinking-logo')?.remove();const b=streamNode.querySelector('.stream-text');if(b)b.textContent=message}else msg(message);streamNode=null;setGenerating(false);focusInput()}$('messageInput').addEventListener('input',resizeInput);$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(e.shiftKey){const s=e.target.selectionStart,en=e.target.selectionEnd;e.target.value=e.target.value.slice(0,s)+'\n'+e.target.value.slice(en);e.target.selectionStart=e.target.selectionEnd=s+1;resizeInput()}}});$('chatForm').addEventListener('submit',e=>{e.preventDefault();if(generating){stopGeneration();return}startGeneration()});setupEmbed();load().catch(e=>{console.error(e);showUnavailable(e?.message||'Please check the Bot ID.')});function setupEmbed(){if(!embed){$('floatButton').classList.add('hidden');return}$('botBox').classList.add('collapsed');$('floatButton').addEventListener('click',()=>{$('botBox').classList.remove('collapsed');$('floatButton').classList.add('hidden');focusInput()})}window.addEventListener('beforeunload',()=>{if(requestController)requestController.abort();if(liveChannel)client.removeChannel(liveChannel);if(runtimeChannel)client.removeChannel(runtimeChannel)})})();
</script>
</body></html>
