<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070d">
<meta name="description" content="Sadeeq AI owner console">
<meta http-equiv="Cache-Control" content="no-store">
<title>Sadeeq AI — Owner</title>
<link rel="stylesheet" href="./auth.css?v=6">
</head>
<body>
<main class="auth-shell">
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>
  <div class="stars" aria-hidden="true"></div>
  <section class="auth-card" aria-labelledby="owner-title">
    <div class="brand-mark" aria-hidden="true">S</div>
    <p class="eyebrow">OWNER CONSOLE</p>
    <h1 id="owner-title">Sadeeq AI</h1>
    <p class="subtitle">Your secure owner session is active.</p>
    <div id="status" class="status show success" role="status" aria-live="polite">Verifying secure session…</div>
    <div class="notice">Level 1 authentication is active. Your session stays active across browser restarts until you explicitly sign out.</div>
    <button id="logout" class="primary-btn" type="button">Sign out <span>↗</span></button>
    <footer>SADEEQ AI • Owner access</footer>
  </section>
</main>
<script src="./config.js?v=6"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  'use strict';
  const supabaseUrl = window.SADEEQ_SUPABASE_URL || '';
  const supabaseKey = window.SADEEQ_SUPABASE_KEY || '';
  const statusEl = document.getElementById('status');
  const logoutButton = document.getElementById('logout');
  const loginUrl = new URL('./index.html?signed_out=1', window.location.href).href;
  let client;

  function setStatus(message, type = 'success') {
    statusEl.textContent = message;
    statusEl.className = `status show ${type}`;
  }

  function createClient() {
    if (client) return client;
    if (!supabaseUrl || !supabaseKey) throw new Error('Supabase public configuration is missing.');
    if (!window.supabase) throw new Error('Authentication service is unavailable.');
    client = window.supabase.createClient(supabaseUrl, supabaseKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });
    return client;
  }

  async function goToLogin() {
    window.location.replace(loginUrl);
  }

  async function verifySession() {
    const c = createClient();
    const { data: { session }, error: sessionError } = await c.auth.getSession();
    if (sessionError) throw sessionError;
    if (!session) {
      await goToLogin();
      return false;
    }
    const { data: isOwner, error: ownerError } = await c.rpc('sadeeq_is_owner');
    if (ownerError) throw ownerError;
    if (isOwner !== true) {
      await c.auth.signOut({ scope: 'local' });
      await goToLogin();
      return false;
    }
    setStatus('Secure owner session verified.');
    return true;
  }

  logoutButton.addEventListener('click', async () => {
    logoutButton.disabled = true;
    logoutButton.textContent = 'Signing out…';
    try {
      const c = createClient();
      // Global sign-out invalidates the refresh token as well as the local session.
      const { error } = await c.auth.signOut({ scope: 'global' });
      if (error) throw error;
      const { data: { session } } = await c.auth.getSession();
      if (session) throw new Error('The session could not be cleared.');
      await goToLogin();
    } catch (error) {
      logoutButton.disabled = false;
      logoutButton.innerHTML = 'Sign out <span>↗</span>';
      setStatus(error?.message || 'Sign out failed. Please try again.', 'error');
    }
  });

  // Re-check when the page becomes visible again, including browser back/forward cache.
  window.addEventListener('pageshow', () => {
    verifySession().catch(error => setStatus(error?.message || 'Session verification failed.', 'error'));
  });

  verifySession().catch(error => setStatus(error?.message || 'Session verification failed.', 'error'));
})();
</script>
</body>
</html>
