<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070d">
<meta name="description" content="Sadeeq AI owner console">
<title>Sadeeq AI — Owner</title>
<link rel="stylesheet" href="./auth.css?v=4">
</head>
<body>
<main class="auth-shell">
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>
  <div class="stars" aria-hidden="true"></div>
  <section class="auth-card" aria-labelledby="owner-title">
    <div class="brand-mark" aria-hidden="true">S</div>
    <p class="eyebrow">OWNER CONSOLE</p>
    <h1 id="owner-title">Sadeeq AI</h1>
    <p class="subtitle">Your secure owner session is active.</p>
    <div id="status" class="status show success" role="status" aria-live="polite">Verifying secure session…</div>
    <div class="notice">Level 1 authentication is active. The full owner dashboard and management modules will be connected in the next build level.</div>
    <button id="logout" class="primary-btn" type="button">Sign out <span>↗</span></button>
    <footer>SADEEQ AI • Owner access</footer>
  </section>
</main>
<script src="./config.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  'use strict';
  const supabaseUrl = window.SADEEQ_SUPABASE_URL || '';
  const supabaseKey = window.SADEEQ_SUPABASE_KEY || '';
  const statusEl = document.getElementById('status');
  const logoutButton = document.getElementById('logout');
  const indexUrl = new URL('./index.html?signed_out=1', window.location.href).href;

  function setStatus(message, type = 'success') {
    statusEl.textContent = message;
    statusEl.className = `status show ${type}`;
  }

  function createClient() {
    if (!supabaseUrl || !supabaseKey) throw new Error('Supabase public configuration is missing.');
    if (!window.supabase) throw new Error('Authentication service is unavailable.');
    return window.supabase.createClient(supabaseUrl, supabaseKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
  }

  async function boot() {
    try {
      const client = createClient();
      const { data: { session } } = await client.auth.getSession();
      if (!session) {
        window.location.replace(new URL('./index.html', window.location.href).href);
        return;
      }
      const { data: isOwner, error } = await client.rpc('sadeeq_is_owner');
      if (error || isOwner !== true) {
        await client.auth.signOut({ scope: 'local' });
        window.location.replace(new URL('./index.html', window.location.href).href);
        return;
      }
      setStatus('Secure owner session verified.');
    } catch (error) {
      setStatus(error?.message || 'Session verification failed.', 'error');
    }
  }

  logoutButton.addEventListener('click', async () => {
    logoutButton.disabled = true;
    logoutButton.textContent = 'Signing out…';
    try {
      const client = createClient();
      const { error } = await client.auth.signOut({ scope: 'local' });
      if (error) throw error;
      const { data: { session } } = await client.auth.getSession();
      if (session) throw new Error('The local session could not be cleared.');
      window.location.replace(indexUrl);
    } catch (error) {
      logoutButton.disabled = false;
      logoutButton.innerHTML = 'Sign out <span>↗</span>';
      setStatus(error?.message || 'Sign out failed. Please try again.', 'error');
    }
  });

  boot();
})();
</script>
</body>
</html>
